<!DOCTYPE html>
<html>
<head>
    <title>Smart Glass Watch</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #0f2027, #203a43, #2c5364);
            font-family: Arial, sans-serif;
        }

        .watch {
            width: 350px;
            height: 520px;
            backdrop-filter: blur(20px);
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 30px cyan;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .analog {
            width: 220px;
            height: 220px;
            border: 6px solid white;
            border-radius: 50%;
            position: relative;
            margin-bottom: 20px;
        }

        /* Clock Numbers */
        .number {
            position: absolute;
            color: white;
            font-size: 18px;
            font-weight: bold;
            transform: translate(-50%, -50%);
        }

        /* Clock Hands */
        .hand {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0%;
            transform: rotate(90deg);
        }

        .hour {
            width: 35%;
            height: 4px;
            background: white;
        }

        .minute {
            width: 45%;
            height: 3px;
            background: white;
        }

        .second {
            width: 50%;
            height: 2px;
            background: red;
        }

        .center-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .digital {
            font-size: 28px;
            margin: 10px 0;
        }

        .date, .day {
            font-size: 16px;
        }

        .alarm-section {
            margin-top: 20px;
            text-align: center;
        }

        input, button {
            padding: 6px;
            border-radius: 5px;
            border: none;
            margin: 5px;
        }

        button {
            cursor: pointer;
            background: cyan;
        }
    </style>
</head>
<body>

<div class="watch">
    <div class="analog" id="analog">
        <div class="hand hour" id="hour"></div>
        <div class="hand minute" id="minute"></div>
        <div class="hand second" id="second"></div>
        <div class="center-dot"></div>
    </div>

    <div class="digital" id="digital"></div>
    <div class="day" id="day"></div>
    <div class="date" id="date"></div>

    <div class="alarm-section">
        <input type="time" id="alarmTime">
        <button onclick="setAlarm()">Set Alarm</button>
        <div id="alarmStatus"></div>
    </div>
</div>

<script>
    const analog = document.getElementById("analog");

    // Create clock numbers dynamically
    for (let i = 1; i <= 12; i++) {
        const number = document.createElement("div");
        number.className = "number";
        number.innerText = i;

        const angle = (i * 30) * (Math.PI / 180);
        const radius = 90;

        const x = 110 + radius * Math.sin(angle);
        const y = 110 - radius * Math.cos(angle);

        number.style.left = x + "px";
        number.style.top = y + "px";

        analog.appendChild(number);
    }

    let alarmTime = null;

    function updateClock() {
        const now = new Date();

        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();

        // AM PM
        let ampm = hours >= 12 ? "PM" : "AM";
        hours = hours % 12;
        hours = hours ? hours : 12;

        let h = hours < 10 ? "0" + hours : hours;
        let m = minutes < 10 ? "0" + minutes : minutes;
        let s = seconds < 10 ? "0" + seconds : seconds;

        document.getElementById("digital").innerText =
            h + " : " + m + " : " + s + " " + ampm;

        const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

        document.getElementById("day").innerText = days[now.getDay()];
        document.getElementById("date").innerText =
            now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear();

        const hourDeg = (hours * 30) + (minutes / 2);
        const minuteDeg = minutes * 6;
        const secondDeg = seconds * 6;

        document.getElementById("hour").style.transform = `rotate(${hourDeg}deg)`;
        document.getElementById("minute").style.transform = `rotate(${minuteDeg}deg)`;
        document.getElementById("second").style.transform = `rotate(${secondDeg}deg)`;

        // Live color glow
        const hue = seconds * 6;
        document.querySelector(".watch").style.boxShadow =
            `0 0 30px hsl(${hue}, 100%, 50%)`;

        const currentTime = now.toTimeString().slice(0,5);
        if (alarmTime === currentTime) {
            alert("⏰ Alarm Ringing!");
            alarmTime = null;
        }
    }

    function setAlarm() {
        alarmTime = document.getElementById("alarmTime").value;
        document.getElementById("alarmStatus").innerText =
            "Alarm set for " + alarmTime;
    }

    setInterval(updateClock, 1000);
    updateClock();
</script>

</body>
</html>
