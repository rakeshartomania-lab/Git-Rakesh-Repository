<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Perfect Synced Watch</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
}

/* Glass Card */
.watch{
    width:380px;
    height:540px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    color:white;
    box-shadow:0 0 40px rgba(0,0,0,0.4);
}

/* Analog */
.analog{
    width:260px;
    height:260px;
    border:6px solid white;
    border-radius:50%;
    position:relative;
    margin-bottom:25px;
}

/* Numbers */
.number{
    position:absolute;
    font-size:18px;
    font-weight:bold;
    transform:translate(-50%,-50%);
}

/* Hands */
.hand{
    position:absolute;
    top:50%;
    left:50%;
    transform-origin:0% 50%;
}

.hour{
    width:30%;
    height:6px;
    background:white;
    border-radius:5px;
}

.minute{
    width:40%;
    height:4px;
    background:white;
    border-radius:4px;
}

.second{
    width:45%;
    height:2px;
    background:red;
}

.center-dot{
    width:14px;
    height:14px;
    background:white;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* Digital */
.digital{
    font-size:30px;
    margin:10px 0;
}

.day,.date{
    font-size:16px;
}
</style>
</head>
<body>

<div class="watch">

    <div class="analog" id="analog">
        <div class="hand hour" id="hour"></div>
        <div class="hand minute" id="minute"></div>
        <div class="hand second" id="second"></div>
        <div class="center-dot"></div>
    </div>

    <div class="digital" id="digital"></div>
    <div class="day" id="day"></div>
    <div class="date" id="date"></div>

</div>

<script>

/* Create numbers */
const analog=document.getElementById("analog");
const size=260;
const center=size/2;
const radius=110;

for(let i=1;i<=12;i++){
    const num=document.createElement("div");
    num.className="number";
    num.innerText=i;

    const angle=i*30*Math.PI/180;

    num.style.left=center + radius*Math.sin(angle) + "px";
    num.style.top=center - radius*Math.cos(angle) + "px";

    analog.appendChild(num);
}

function updateClock(){

    const now=new Date();

    const h24=now.getHours();
    const m=now.getMinutes();
    const s=now.getSeconds();
    const ms=now.getMilliseconds();

    /* DIGITAL */
    const displayH=h24%12||12;
    const ampm=h24>=12?"PM":"AM";

    document.getElementById("digital").innerText=
        displayH.toString().padStart(2,"0")+" : "+
        m.toString().padStart(2,"0")+" : "+
        s.toString().padStart(2,"0")+" "+ampm;

    const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    document.getElementById("day").innerText=days[now.getDay()];
    document.getElementById("date").innerText=
        now.getDate()+" "+months[now.getMonth()]+" "+now.getFullYear();

    /* PERFECT SYNC CALCULATION */

    const hourAngle=(h24%12)*30 + m*0.5 + s*(0.5/60);
    const minuteAngle=m*6 + s*0.1 + ms*0.0001*6;
    const secondAngle=s*6 + ms*0.006;

    document.getElementById("hour").style.transform=
        `rotate(${hourAngle}deg)`;

    document.getElementById("minute").style.transform=
        `rotate(${minuteAngle}deg)`;

    document.getElementById("second").style.transform=
        `rotate(${secondAngle}deg)`;

    requestAnimationFrame(updateClock);
}

updateClock();

</script>

</body>
</html>
