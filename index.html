<!DOCTYPE html>
<html>
<head>
    <title>Exact Synced Flower Watch</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: url("https://images.unsplash.com/photo-1490750967868-88aa4486c946")
            no-repeat center center/cover;
        }

        .watch {
            width: 360px;
            height: 520px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 20px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .analog {
            width: 240px;
            height: 240px;
            border: 6px solid white;
            border-radius: 50%;
            position: relative;
            margin-bottom: 20px;
        }

        .number {
            position: absolute;
            font-size: 18px;
            font-weight: bold;
            transform: translate(-50%, -50%);
        }

        .hand {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 0% 50%;
        }

        .hour {
            width: 30%;
            height: 5px;
            background: white;
            border-radius: 5px;
        }

        .minute {
            width: 40%;
            height: 4px;
            background: white;
            border-radius: 4px;
        }

        .second {
            width: 45%;
            height: 2px;
            background: red;
        }

        .center-dot {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .digital {
            font-size: 26px;
            margin: 10px 0;
        }

        .date, .day {
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="watch">
    <div class="analog" id="analog">
        <div class="hand hour" id="hour"></div>
        <div class="hand minute" id="minute"></div>
        <div class="hand second" id="second"></div>
        <div class="center-dot"></div>
    </div>

    <div class="digital" id="digital"></div>
    <div class="day" id="day"></div>
    <div class="date" id="date"></div>
</div>

<script>
    const analog = document.getElementById("analog");

    // Create numbers
    for (let i = 1; i <= 12; i++) {
        const number = document.createElement("div");
        number.className = "number";
        number.innerText = i;

        const angle = (i * 30) * (Math.PI / 180);
        const radius = 100;

        const x = 120 + radius * Math.sin(angle);
        const y = 120 - radius * Math.cos(angle);

        number.style.left = x + "px";
        number.style.top = y + "px";

        analog.appendChild(number);
    }

    function updateClock() {

        const now = new Date();

        // TAKE SAME VALUES FOR BOTH DIGITAL & ANALOG
        const hours24 = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const milliseconds = now.getMilliseconds();

        /* DIGITAL TIME */
        const displayHour = hours24 % 12 || 12;
        const ampm = hours24 >= 12 ? "PM" : "AM";

        document.getElementById("digital").innerText =
            displayHour.toString().padStart(2,"0") + " : " +
            minutes.toString().padStart(2,"0") + " : " +
            seconds.toString().padStart(2,"0") + " " + ampm;

        /* DATE & DAY */
        const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

        document.getElementById("day").innerText = days[now.getDay()];
        document.getElementById("date").innerText =
            now.getDate() + " " + months[now.getMonth()] + " " + now.getFullYear();

        /* EXACT ANALOG ROTATION */

        const hourDeg = (hours24 % 12) * 30 +
                        minutes * 0.5 +
                        seconds * (0.5 / 60);

        const minuteDeg = minutes * 6 +
                          seconds * 0.1;

        const secondDeg = seconds * 6 +
                          milliseconds * 0.006;

        document.getElementById("hour").style.transform =
            `rotate(${hourDeg}deg)`;

        document.getElementById("minute").style.transform =
            `rotate(${minuteDeg}deg)`;

        document.getElementById("second").style.transform =
            `rotate(${secondDeg}deg)`;

        requestAnimationFrame(updateClock);
    }

    updateClock();
</script>

</body>
</html>
