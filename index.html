<script>
const analog = document.getElementById("analog");

/* Create numbers */
for (let i = 1; i <= 12; i++) {
    const num = document.createElement("div");
    num.className = "number";
    num.innerText = i;

    const angle = i * 30 * Math.PI / 180;
    const radius = 110;
    const center = 125;

    num.style.left = center + radius * Math.sin(angle) + "px";
    num.style.top = center - radius * Math.cos(angle) + "px";

    analog.appendChild(num);
}

function updateClock() {

    const now = new Date();

    const h24 = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ms = now.getMilliseconds();

    /* DIGITAL */
    const displayH = h24 % 12 || 12;
    const ampm = h24 >= 12 ? "PM" : "AM";

    document.getElementById("digital").innerText =
        displayH.toString().padStart(2,"0") + " : " +
        m.toString().padStart(2,"0") + " : " +
        s.toString().padStart(2,"0") + " " + ampm;

    const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    document.getElementById("day").innerText = days[now.getDay()];
    document.getElementById("date").innerText =
        now.getDate()+" "+months[now.getMonth()]+" "+now.getFullYear();

    /* PERFECT ANALOG CALCULATION */

    // Hour: 30° per hour + 0.5° per minute + 0.00833° per second
    const hourAngle =
        (h24 % 12) * 30 +
        m * 0.5 +
        s * (0.5 / 60);

    // Minute: 6° per minute + 0.1° per second + ms adjustment
    const minuteAngle =
        m * 6 +
        s * 0.1 +
        ms * 0.0001 * 6;

    // Second: 6° per second + ms smooth
    const secondAngle =
        s * 6 +
        ms * 0.006;

    document.getElementById("hour").style.transform =
        `translate(-0%, -50%) rotate(${hourAngle}deg)`;

    document.getElementById("minute").style.transform =
        `translate(-0%, -50%) rotate(${minuteAngle}deg)`;

    document.getElementById("second").style.transform =
        `translate(-0%, -50%) rotate(${secondAngle}deg)`;

    requestAnimationFrame(updateClock);
}

updateClock();
</script>
